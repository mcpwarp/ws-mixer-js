name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # publishConfig.registry (the public npm registry) plus
      # scripts/check-registry.mjs's prepublishOnly guard together pin the
      # actual publish target -- see package.json and the flag in
      # docs/MIGRATION.md section 4.1 about that pairing with an Apache-2.0
      # license.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
